[package]
name = "steno-daemon"
version = "0.1.0"
edition = "2024"

[features]
# CUDA transcription is the supported path; build with
# `--no-default-features` for a CPU-only (portable) daemon.
default = ["cuda"]
cuda = ["parakeet-rs/cuda"]

[lints]
workspace = true

[dependencies]
kbd = "0.2.0"
kbd-global = { version = "0.2.0", features = ["grab"] }
log = "0.4.27"
env_logger = "0.11"
hf-hub = "1.0.0"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["full"] }
rand = "0.8"
tokio-util = { version = "0.7.19", features = ["rt"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
parakeet-rs = "0.3.7"
pipewire = "0.10.1"
hound = "3.5.1"
chrono = "0.4.45"
