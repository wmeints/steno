# Lefthook git hooks configuration
# Docs: https://github.com/evilmartians/lefthook

# Run the test suite on every commit and reject it on failure.
# `cargo test` builds and runs unit tests for all workspace members
# (crates/steno-cosmic, crates/steno-daemon).
pre-commit:
  commands:
    test:
      run: cargo test

# Enforce Conventional Commits on every commit message via commitlint.
# The `commit-msg` hook receives the path to the pending commit message
# file as `{1}` (git passes it as the first argument); commitlint's
# `--edit` validates it in place and rejects the commit on failure.
commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
